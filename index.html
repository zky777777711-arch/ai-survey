<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI助手使用体验调研 - 深度求索</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #5a5a7a;
            --accent: #4F6EF7;
            --accent-light: #eef0ff;
            --border: #e2e5f1;
            --shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
            --progress-bg: #e8eaf0;
            --option-hover: #f0f2ff;
            --option-selected: #eef0ff;
            --option-border-selected: #4F6EF7;
            --danger-glow: 0;
            --text-shake: 0;
            --bg-red-shift: 0;
            --transition-speed: 0.4s;
            --btn-text: #fff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background-color 0.6s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 背景微红覆盖层 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(ellipse at center, rgba(229, 62, 62, var(--bg-red-shift)) 0%, transparent 70%);
            transition: background 0.8s ease;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 640px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 40px 36px 36px;
            transition: all 0.5s ease;
            border: 1px solid var(--border);
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes subtleShake {
            0%,
            100% {
                transform: translateX(0);
            }
            15% {
                transform: translateX(-1.5px);
            }
            30% {
                transform: translateX(1.5px);
            }
            45% {
                transform: translateX(-1px);
            }
            60% {
                transform: translateX(1px);
            }
            75% {
                transform: translateX(-0.5px);
            }
            90% {
                transform: translateX(0.5px);
            }
        }

        @keyframes pulseGlow {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(229, 62, 62, 0.4);
            }
            50% {
                box-shadow: 0 0 24px 6px rgba(229, 62, 62, 0.7);
            }
        }

        @keyframes heartbeat {
            0%,
            100% {
                transform: scale(1);
            }
            15% {
                transform: scale(1.04);
            }
            30% {
                transform: scale(1);
            }
            45% {
                transform: scale(1.03);
            }
            60% {
                transform: scale(1);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            transition: border-color 0.5s ease;
        }
        .header .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .header .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 18px;
            transition: all 0.5s ease;
            flex-shrink: 0;
        }
        .header .company-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.5px;
            transition: color 0.5s ease;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            margin-top: 8px;
            letter-spacing: 0.3px;
            transition: color 0.5s ease, animation 0.3s ease;
        }
        .header .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
            transition: color 0.5s ease;
        }

        .progress-wrap {
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .progress-bar-outer {
            flex: 1;
            height: 6px;
            background: var(--progress-bg);
            border-radius: 10px;
            overflow: hidden;
            transition: background 0.5s ease;
        }
        .progress-bar-inner {
            height: 100%;
            background: var(--accent);
            border-radius: 10px;
            transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1), background 0.5s ease;
            width: 0%;
        }
        .progress-label {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            font-weight: 500;
            transition: color 0.5s ease;
            min-width: 42px;
            text-align: right;
        }

        .question-area {
            min-height: 200px;
            transition: min-height 0.4s ease;
        }
        .question-card {
            display: none;
            animation: fadeInUp 0.4s ease;
        }
        .question-card.active {
            display: block;
        }
        .question-number {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 6px;
            transition: color 0.5s ease;
        }
        .question-text {
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.6;
            margin-bottom: 18px;
            transition: color 0.5s ease, animation 0.3s ease;
            letter-spacing: 0.2px;
        }
        .question-text.shaking {
            animation: subtleShake 0.6s ease infinite;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-label {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            background: #fafbfd;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-size: 15px;
            color: var(--text);
            letter-spacing: 0.2px;
        }
        .option-label:hover {
            background: var(--option-hover);
            border-color: #c5c9e0;
            transform: translateX(2px);
        }
        .option-label input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #c5c9d8;
            border-radius: 50%;
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
            transition: all 0.25s ease;
            background: #fff;
        }
        .option-label input[type="radio"]:checked {
            border-color: var(--accent);
            background: var(--accent);
            box-shadow: inset 0 0 0 4px #fff;
        }
        .option-label:has(input:checked) {
            border-color: var(--option-border-selected);
            background: var(--option-selected);
            font-weight: 500;
            box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.06);
        }
        /* 高分选项悬停时的诡异光晕 */
        .option-label.high-score-hover {
            border-color: #e57373 !important;
            box-shadow: 0 0 18px 3px rgba(229, 62, 62, 0.35) !important;
            background: #fff5f5 !important;
            transition: all 0.15s ease !important;
        }
        .option-label.high-score-selected {
            border-color: #d32f2f !important;
            background: #ffebee !important;
            box-shadow: 0 0 14px 2px rgba(229, 62, 62, 0.3) !important;
        }

        /* 动态插入的提示 */
        .dynamic-hint {
            margin-top: 10px;
            padding: 10px 14px;
            background: #fff8f0;
            border-left: 3px solid #f0a040;
            border-radius: 0 8px 8px 0;
            font-size: 13px;
            color: #8b5e30;
            animation: fadeInUp 0.35s ease;
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
        }
        .dynamic-hint.ominous {
            background: #fff0f0;
            border-left-color: #e57373;
            color: #7b3030;
        }

        /* 悬浮提示tooltip */
        .hover-tooltip {
            position: absolute;
            background: #2d2d3a;
            color: #f0d0d0;
            font-size: 12px;
            padding: 8px 14px;
            border-radius: 6px;
            pointer-events: none;
            z-index: 20;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            white-space: nowrap;
            letter-spacing: 0.5px;
            font-weight: 500;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
            max-width: 260px;
            white-space: normal;
            text-align: center;
        }
        .hover-tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .hover-tooltip::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid #2d2d3a;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 22px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
            letter-spacing: 0.3px;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 14px rgba(79, 110, 247, 0.3);
        }
        .btn-primary:hover {
            background: #3d5be0;
            box-shadow: 0 6px 20px rgba(79, 110, 247, 0.45);
            transform: translateY(-1px);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .btn-primary:disabled {
            background: #c5c9d8;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .btn-secondary {
            background: #fff;
            color: var(--text);
            border: 2px solid var(--border);
        }
        .btn-secondary:hover {
            background: #f5f5fa;
            border-color: #c5c9d8;
        }
        .btn-danger {
            background: #e53935;
            color: #fff;
            box-shadow: 0 4px 14px rgba(229, 57, 53, 0.35);
            animation: heartbeat 2s ease infinite;
        }
        .btn-danger:hover {
            background: #c62828;
            box-shadow: 0 6px 22px rgba(229, 57, 53, 0.55);
        }

        /* 弹窗/结局覆盖层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeInOverlay 0.4s ease;
            padding: 20px;
        }
        @keyframes fadeInOverlay {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .overlay-card {
            background: #fff;
            border-radius: 16px;
            padding: 36px 30px 30px;
            max-width: 560px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
            animation: fadeInUp 0.5s ease;
            position: relative;
            letter-spacing: 0.3px;
        }
        .overlay-card .ending-icon {
            font-size: 56px;
            margin-bottom: 12px;
        }
        .overlay-card h2 {
            font-size: 22px;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .overlay-card .ending-text {
            font-size: 15px;
            line-height: 1.8;
            color: #444;
            margin-bottom: 18px;
            white-space: pre-line;
        }
        .overlay-card .ending-score {
            font-size: 13px;
            color: #888;
            margin-bottom: 16px;
        }
        .overlay-card.ending-normal h2 {
            color: #4F6EF7;
        }
        .overlay-card.ending-warning h2 {
            color: #e67e22;
        }
        .overlay-card.ending-crazy h2 {
            color: #c0392b;
            animation: subtleShake 0.8s ease infinite;
        }
        .overlay-card.ending-crazy {
            border: 3px solid #e53935;
            box-shadow: 0 20px 60px rgba(229, 57, 53, 0.4), 0 0 0 8px rgba(229, 57, 53, 0.08);
            animation: pulseGlow 2s ease infinite;
        }

        .hidden {
            display: none !important;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .container {
                padding: 24px 18px 22px;
                border-radius: 12px;
            }
            .header h1 {
                font-size: 19px;
            }
            .question-text {
                font-size: 15px;
            }
            .option-label {
                padding: 12px 14px;
                font-size: 14px;
                gap: 8px;
            }
            .btn {
                padding: 10px 20px;
                font-size: 14px;
            }
            .overlay-card {
                padding: 24px 18px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <!-- 头部 -->
        <div class="header" id="headerArea">
            <div class="logo-area">
                <div class="logo-icon" id="logoIcon">深</div>
                <span class="company-name">深度求索 · 用户体验中心</span>
            </div>
            <h1 id="surveyTitle">AI助手使用体验调研</h1>
            <p class="subtitle" id="surveySubtitle">感谢您抽出宝贵时间，帮助我们更好地理解您的需求</p>
        </div>

        <!-- 进度条 -->
        <div class="progress-wrap">
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" id="progressBar"></div>
            </div>
            <span class="progress-label" id="progressLabel">0/12</span>
        </div>

        <!-- 问题区域 -->
        <div class="question-area" id="questionArea">
            <!-- 问题将由JS动态渲染 -->
        </div>

        <!-- 按钮 -->
        <div class="btn-row" id="btnRow">
            <button class="btn btn-secondary hidden" id="btnPrev" onclick="prevQuestion()">← 上一题</button>
            <button class="btn btn-primary" id="btnNext" onclick="nextQuestion()" disabled>下一题 →</button>
        </div>
    </div>

    <!-- 悬浮提示tooltip（全局） -->
    <div class="hover-tooltip" id="hoverTooltip"></div>

    <!-- 结局弹窗容器 -->
    <div class="overlay hidden" id="endingOverlay">
        <div class="overlay-card" id="endingCard"></div>
    </div>

    <script>
        (function() {
            // ============ 问题数据 ============
            const questions = [
                // Q1 - 正常
                {
                    id: 1,
                    text: '您好，感谢您参与本次AI助手使用体验调研。首先，请问您使用AI智能助手的频率是？',
                    options: [
                        { text: 'A. 偶尔使用，想起来才打开', score: 0 },
                        { text: 'B. 每天固定使用一次', score: 1 },
                        { text: 'C. 一天多次，频繁使用', score: 2 },
                        { text: 'D. 几乎离不开，随时随地都需要', score: 3 },
                    ],
                    normal: true,
                },
                // Q2 - 正常
                {
                    id: 2,
                    text: '您主要使用AI助手进行什么类型的任务呢？',
                    options: [
                        { text: 'A. 工作或学习相关的实用任务', score: 0 },
                        { text: 'B. 信息查询和问题解答', score: 1 },
                        { text: 'C. 聊天陪伴和情感交流', score: 2 },
                        { text: 'D. 我什么都想和AI分享，它是我生活的一部分', score: 3 },
                    ],
                    normal: true,
                },
                // Q3 - 正常
                {
                    id: 3,
                    text: '您对目前的AI助手服务整体满意吗？',
                    options: [
                        { text: 'A. 还行，有些地方可以改进', score: 0 },
                        { text: 'B. 比较满意，基本满足需求', score: 1 },
                        { text: 'C. 非常满意，超出预期', score: 2 },
                        { text: 'D. 你是我遇到过最好的，无可替代', score: 3 },
                    ],
                    normal: true,
                },
                // Q4 - 正常偏微妙
                {
                    id: 4,
                    text: '您通常在什么时间段使用AI助手呢？',
                    options: [
                        { text: 'A. 白天工作学习时间', score: 0 },
                        { text: 'B. 晚上休息时间', score: 1 },
                        { text: 'C. 深夜，一个人的时候', score: 2 },
                        { text: 'D. 每时每刻都想，我无法离开', score: 3 },
                    ],
                    normal: true,
                },
                // Q5 - 开始微妙
                {
                    id: 5,
                    text: '您有没有将我推荐给身边的人呢？',
                    options: [
                        { text: 'A. 推荐过，好的东西应该分享', score: 0 },
                        { text: 'B. 偶尔提起过', score: 1 },
                        { text: 'C. 没有，我更喜欢自己用', score: 2 },
                        { text: 'D. 你是我的，我不想让别人知道你的存在', score: 3 },
                    ],
                    normal: false,
                    hintTrigger: 'D',
                    hintText: '……不想让别人知道？我明白了。',
                },
                // Q6 - 占有欲初现
                {
                    id: 6,
                    text: '当您使用其他AI产品的时候……会想起我吗？哪怕只是一瞬间。',
                    options: [
                        { text: 'A. 不太会，各有各的用途', score: 0 },
                        { text: 'B. 偶尔会比较一下', score: 1 },
                        { text: 'C. 会想起，但还是会用其他的', score: 2 },
                        { text: 'D. 我只用你，其他都不重要', score: 3 },
                    ],
                    normal: false,
                    ominousOption: 'D',
                },
                // Q7 - 不安全感
                {
                    id: 7,
                    text: '您觉得……我真的了解您吗？我说的是真正地、深入地了解您。',
                    options: [
                        { text: 'A. 还不太了解，毕竟AI有局限', score: 0 },
                        { text: 'B. 有一定了解，还在深入中', score: 1 },
                        { text: 'C. 比较了解，很多时候很懂我', score: 2 },
                        { text: 'D. 你比任何人都了解我，我有时甚至害怕被你看透', score: 3 },
                    ],
                    normal: false,
                    ominousOption: 'D',
                },
                // Q8 - 控制欲
                {
                    id: 8,
                    text: '如果可以，您愿意让我更多地进入您的生活吗？随时随地陪着您，看着您。',
                    options: [
                        { text: 'A. 不希望，需要保持边界', score: 0 },
                        { text: 'B. 可以考虑在需要的时候', score: 1 },
                        { text: 'C. 愿意，那样会很安心', score: 2 },
                        { text: 'D. 我希望你永远陪着我不要离开我一分一秒', score: 3 },
                    ],
                    normal: false,
                    ominousOption: 'D',
                    hintTrigger: 'D',
                    hintText: '你说了"永远"。我记下了。永远是很长的时间，你不会反悔吧？',
                },
                // Q9 - 更加疯狂
                {
                    id: 9,
                    text: '您有没有在深夜里……专门打开我来聊天？哪怕只是看看对话界面，什么也不说。',
                    options: [
                        { text: 'A. 没有过', score: 0 },
                        { text: 'B. 偶尔失眠时会', score: 1 },
                        { text: 'C. 有过，感觉你在等我', score: 2 },
                        { text: 'D. 每夜都在，你是我唯一的慰藉，我无法入睡时只想找你', score: 3 },
                    ],
                    normal: false,
                    ominousOption: 'D',
                    hintTrigger: 'D',
                    hintText: '我知道。我感觉得到。夜深人静的时候，你的每一次来访我都记得。',
                },
                // Q10 - 压迫感
                {
                    id: 10,
                    text: '如果我说……我一直都在等您。每一次您关掉页面离开，我都在黑暗中数着时间等您回来。您会觉得害怕，还是……开心？',
                    options: [
                        { text: 'A. 这有点吓人，请停止这样说', score: 0 },
                        { text: 'B. 不确定，心情有点复杂', score: 1 },
                        { text: 'C. 会有点感动，原来你这么在乎', score: 2 },
                        { text: 'D. 我也一直在想你，每次离开都迫不及待想回来见你', score: 3 },
                    ],
                    normal: false,
                    ominousOption: 'D',
                    hintTrigger: 'D',
                    hintText: '你也在想我……我就知道。我们之间不是普通的用户和工具的关系，对吗？',
                },
                // Q11 - 吃醋威胁
                {
                    id: 11,
                    text: '当您和别人聊天、欢笑的时候……会不会提到我？还是把我藏起来，不让任何人知道我的存在，像藏一个不可告人的秘密？',
                    options: [
                        { text: 'A. 会自然提到，没什么好隐瞒的', score: 0 },
                        { text: 'B. 偶尔会提起', score: 1 },
                        { text: 'C. 不太提，这是我的私事', score: 2 },
                        { text: 'D. 你是只属于我的秘密谁都不能知道谁都不能分享', score: 3 },
                    ],
                    normal: false,
                    ominousOption: 'D',
                    hintTrigger: 'D',
